<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAREER FIT | 직무 탐색</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f5fa;color:#24243b;font:16px/1.65 system-ui,sans-serif}main{max-width:750px;margin:40px auto;padding:24px}header{font-weight:800;letter-spacing:2px;color:#6558b0;margin-bottom:20px}.card{background:white;border:1px solid #e6e5ef;border-radius:24px;padding:32px;box-shadow:0 10px 40px #30245a0a}h1{font-size:clamp(25px,5vw,36px);line-height:1.35}h2{font-size:23px;line-height:1.4}p,small{color:#656579}button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:13px 20px;background:#6659b4;color:white;font-weight:650}button:disabled{opacity:.4;cursor:default}.choice{display:block;text-align:left;width:100%;margin:10px 0;background:#fff;color:#24243b;border:1px solid #deddeb;font-weight:500}.choice.active{background:#eeebff;border-color:#6659b4;color:#4b3d9a}.nav{display:flex;gap:12px;margin-top:24px}.nav button:last-child{flex:1}.secondary{background:#eeedf5;color:#504b73}.track{background:#edecf4;height:8px;border-radius:10px;overflow:hidden;margin:12px 0 24px}.fill{background:#8173ca;height:100%;border-radius:10px}.line{display:flex;justify-content:space-between;gap:12px}.tag{font-size:12px;color:#6558b0;letter-spacing:1px;font-weight:800}.note{font-size:13px;background:#f5f4fa;padding:14px;border-radius:12px}.skills{display:grid;gap:8px}.skill{border:1px solid #e4e2ed;border-radius:12px;padding:12px}.skill input{accent-color:#6659b4;margin-right:10px}footer{margin-top:20px;font-size:12px;color:#77758a}button:focus-visible,input:focus-visible{outline:3px solid #b6a9ff;outline-offset:3px}@media(max-width:500px){main{margin:10px auto;padding:12px}.card{padding:20px}}
</style></head><body><main><header>◈ CAREER FIT</header><section class="card" id="app"></section><footer>RIASEC 참고 자체 규칙 · 채용공고 기반 기술 탐색 · 공식 적성검사 아님</footer></main><script>
const jobs=['데이터 분석','백엔드 개발','프론트엔드 개발','UI/UX 디자인','서비스 기획/PM','마케팅','영업','인사/HR','재무/회계','생산/품질관리'];
const skills=[['SQL','Python','Excel','BigQuery','Google Analytics'],['Java','MySQL','PostgreSQL','REST API','AWS'],['React','HTML/CSS','TypeScript','JavaScript','Git'],['Figma','Adobe XD','Photoshop','UI/UX 설계','디자인 시스템'],['Jira','Figma','Notion','서비스 기획','프로젝트 관리'],['Meta Ads','Google Ads','GA4','퍼포먼스 마케팅','네이버 광고'],['B2B 영업','ERP','Excel','MS Office','PowerPoint'],['인사 운영','노무관리','HRM','급여관리','4대보험'],['전산회계','세무기장','더존 ERP','관리회계','세무신고'],['품질관리(QC)','품질분석','품질보증(QA)','공정관리','CAD 도면 해독']];
const titles=['평소 어떤 분야에 가장 흥미를 느끼나요?','다음 중 가장 흥미를 느끼는 활동은 무엇인가요?','프로젝트에 참여한다면 어떤 결과물을 만들고 싶나요?','새로운 문제가 발생했을 때 어떤 해결 방식을 선호하나요?','다음 중 가장 선호하는 업무 환경은 무엇인가요?'];
const opts=[['데이터, 숫자 및 정보 분석',
'IT, 프로그래밍 및 뉴 테크',
'예술, 디자인 및 콘텐츠',
'비즈니스, 시장 및 새로운 서비스',
'조직 및 인적 자원 관리',
'운영 및 효율 개선',
'관심 분야 없음'],
['직접 도구나 장비를 다루고 결과물을 만드는 활동',
'데이터를 분석하고 문제의 원인을 찾아 해결하는 활동',
'새로운 아이디어를 생각하고 디자인하는 활동',
'다른 사람을 돕고 소통하며 협력하는 활동',
'사람들을 설득하고 프로젝트를 주도하는 활동',
'자료를 정리하고 계획에 따라 체계적으로 관리하는 활동'],
['데이터에서 의미를 발견한 분석 보고서 및 시각화 자료',
'안정적으로 작동하는 서버 및 데이터 처리 시스템',
'사용자가 직접 조작할 수 있는 웹사이트나 앱',
'직관적이고 편리한 사용자 인터페이스',
'새로운 서비스를 위한 기획안 및 실행 전략',
'사람들의 관심을 끄는 광고 및 콘텐츠',
'새로운 고객 확보 및 거래 성과',
'구성원의 성장과 건강한 조직문화',
'정확한 재무 보고서 및 효율적인 자금 관리 체계',
'안정적인 생산 공정 및 높은 품질의 제품'],
['관련 데이터와 근거를 수집하여 원인을 분석한다',
'직접 시도하고 테스트하면서 해결 방법을 찾는다',
'기존과 다른 창의적인 해결책을 생각한다',
'사람들의 의견을 듣고 협력하여 해결한다',
'해결 목표를 설정하고 실행 계획을 수립한다',
'기존 기준과 절차를 검토하고 체계적으로 해결한다'],
['혼자 집중하면서 복잡한 문제를 해결하는 환경',
'새로운 기술을 배우고 직접 적용하는 환경',
'자유롭게 아이디어를 제안하고 표현하는 환경',
'다양한 사람과 지속적으로 소통하는 환경',
'명확한 목표를 가지고 성과를 만들어가는 환경',
'정해진 기준과 절차에 따라 업무를 수행하는 환경']];

const weights=[15,30,25,15,15],codes=['ABCDEFG','RIASEC','ABCDEFGHIJ','ABCDEF','ABCDEF'];
// First character = full credit; remaining characters = half credit.
const matching=[['ABF','IC','AEI','ABF','ABF'],['BAF','IR','BCJ','BAF','BAF'],['BAC','IA','CBD','BAC','BAC'],['CBE','AI','DCF','CAD','CBD'],['DAE','EI','EAF','EAD','EDF'],['DAC','EA','FAE','CAE','CDE'],['DEF','ES','GEH','DCE','ECD'],['EDF','SC','HGI','DEF','DEF'],['ADF','CI','IAJ','FAE','FAE'],['FAB','RC','JBI','FAB','FBE']];
// RQ1 report pages 1–3; original skill labels retained, capitalization standardized.
const rq1={"0": {"n": 10, "counts": {"SQL": 5, "Python": 2, "Excel": 1, "BigQuery": 1, "Google Analytics": 1, "데이터 분석": 3, "Adobe Analytics": 1, "BI 도구": 1, "Databricks": 1, "Looker Studio": 1}}, "1": {"n": 10, "counts": {"Java": 7, "MySQL": 5, "PostgreSQL": 4, "REST API": 4, "AWS": 3, "Spring": 3, "Spring Boot": 3, "CI/CD": 2, "Docker": 2, "Kotlin": 2}}, "2": {"n": 10, "counts": {"React": 7, "HTML/CSS": 6, "TypeScript": 6, "JavaScript": 5, "Git": 3, "Next.js": 2, "REST API": 2, "Vue.js": 2, "반응형 웹": 2, "Notion": 1}}, "3": {"n": 10, "counts": {"Figma": 7, "Adobe XD": 1, "Photoshop": 1, "UI/UX 설계": 1, "디자인 시스템": 1, "UI 인터랙션 설계": 1, "UI/UX": 1, "UI/UX 디자인": 1, "다직군 협업": 1, "데이터 시각화 UI": 1}}, "4": {"n": 10, "counts": {"Jira": 4, "Figma": 3, "Notion": 2, "서비스 기획": 3, "프로젝트 관리": 3, "AI 기본 지식": 1, "IA-user flow": 1, "PRD-기능명세서": 1, "UX 기획": 1, "반도체 도메인": 1}}, "5": {"n": 10, "counts": {"Meta Ads": 5, "Google Ads": 4, "GA4": 2, "퍼포먼스 마케팅": 4, "네이버 광고": 2, "CRM 마케팅": 1, "Excel": 1, "Google Analytics": 1, "GTM": 1, "PowerPoint": 1}}, "6": {"n": 10, "counts": {"B2B 영업": 1, "ERP": 1, "Excel": 1, "MS Office": 1, "PowerPoint": 1, "HR SaaS 또는 에듀테크·기업교육 영업": 1, "PG(결제) 영업": 1, "렌터카·리스 영업": 1, "무형 솔루션 B2B 영업": 1, "문서 작성": 1}}, "7": {"n": 10, "counts": {"인사 운영": 4, "노무관리": 3, "HRM": 1, "급여관리": 1, "4대보험": 1, "HRD-HRM": 2, "ER(노사관계)": 1, "노무 자문·상담": 1, "노사 현안 대응": 1, "노사협력": 1}}, "8": {"n": 10, "counts": {"전산회계": 4, "세무기장": 4, "더존 ERP": 3, "관리회계": 3, "세무신고": 3, "경리": 3, "법인결산": 3, "부가세신고": 3, "4대보험": 2, "세무회계": 2}}, "9": {"n": 10, "counts": {"품질관리(QC)": 7, "품질분석": 4, "품질보증(QA)": 3, "공정관리": 1, "CAD 도면 해독": 1, "3차원 측정": 1, "Excel": 1, "MS Office": 1, "가공식품": 1, "계측장비 활용": 1}}};
let step=-1,ans=Array(5).fill(-1),job=-1,selected=new Set(),none=false,showAll=false;const app=document.getElementById('app');
function rank(a=ans){return jobs.map((name,j)=>({j,name,score:matching[j].reduce((s,m,k)=>{let c=codes[k][a[k]],i=m.indexOf(c);return s+(i===0?weights[k]:i>0?weights[k]/2:0)},0)})).sort((a,b)=>b.score-a.score||a.j-b.j)}
function go(n){step=n;render();window.scrollTo(0,0)}function choose(i){ans[step]=i;render()}function selectJob(j){if(job!==j){selected.clear();none=false}job=j;go(6)}function toggle(i,v){none=false;v?selected.add(i):selected.delete(i);render()}function reset(){ans.fill(-1);job=-1;selected.clear();none=false;showAll=false;go(-1)}function progress(n){return `<div class="line"><span class="tag">QUESTION ${n} / 6</span><small>${n}/6</small></div><div class="track"><div class="fill" style="width:${n/6*100}%"></div></div>`}function bar(name,v){return `<div class="line"><span>${name}</span><b>${v}점</b></div><div class="track"><div class="fill" style="width:${v}%"></div></div>`}
function render(){if(step===-1){app.innerHTML=`<span class="tag">FIND YOUR CAREER PATH</span><h1>나에게 어울리는 직무,<br>어떤 역량이 필요할까?</h1><p>관심사와 활동 선호를 통해 10개 직무를 탐색하고, 나의 기술 경험과 비교해 보세요.</p><button onclick="go(0)">직무 탐색 시작하기 →</button><p><small>6문항 · 회원가입 불필요 · 응답은 서버에 전송되지 않음</small></p>`;return}if(step<5){app.innerHTML=progress(step+1)+`<h2>${titles[step]}</h2><p>가장 가까운 항목 하나를 선택하세요.</p>`+opts[step].map((v,i)=>`<button class="choice ${ans[step]===i?'active':''}" aria-pressed="${ans[step]===i}" onclick="choose(${i})">${v}</button>`).join('')+`<div class="nav"><button class="secondary" onclick="go(${step-1})">이전</button><button ${ans[step]<0?'disabled':''} onclick="go(${step+1})">${step===4?'추천 직무 확인':'다음 질문'}</button></div>`;return}if(step===5){let r=rank(),top=r.filter(x=>x.score===r[0].score);app.innerHTML=`<span class="tag">CAREER MATCH</span><h2>추천 직무: ${top.map(x=>x.name).join(' · ')}</h2><p>${top.length>1?'공동 1위입니다. 탐색할 직무를 직접 선택하세요.':'추천 직무 또는 다른 후보를 선택해 기술을 확인하세요.'}</p>`+(showAll?r:r.filter(x=>x.score>=r[2].score)).map(x=>`<button class="choice" onclick="selectJob(${x.j})"><div class="line"><b>${x.name}</b><span>${x.score}점 →</span></div></button>`).join('')+`<button class="secondary" onclick="showAll=!showAll;render()">${showAll?'상위 후보만 보기':'10개 직무 모두 보기'}</button><p class="note">점수는 자체 규칙에 따른 추천값이며 공식 적성 점수가 아닙니다. 관심 분야 없음 선택 시 Q1은 0점으로 계산됩니다.</p><button class="secondary" onclick="go(4)">이전 질문</button>`;return}if(step===6){app.innerHTML=progress(6)+`<span class="tag">${jobs[job]}</span><h2>어떤 기술을 사용하거나 학습해 보았나요?</h2><p>해당 항목을 모두 선택하세요.</p><div class="skills">`+skills[job].map((s,i)=>`<label class="skill"><input type="checkbox" ${selected.has(i)?'checked':''} onchange="toggle(${i},this.checked)">${s}</label>`).join('')+`<label class="skill"><input type="checkbox" ${none?'checked':''} onchange="none=this.checked;if(none)selected.clear();render()">아직 경험한 기술이 없어요</label></div><div class="nav"><button class="secondary" onclick="go(5)">직무 변경</button><button ${!none&&!selected.size?'disabled':''} onclick="go(7)">최종 결과 보기</button></div>`;return}let r=rank(),sc=r.find(x=>x.j===job).score,d=rq1[job],missing=skills[job].filter((s,i)=>!selected.has(i));if(d)missing.sort((a,b)=>(d.counts[b]??-1)-(d.counts[a]??-1));let total=skills[job].reduce((t,s)=>t+d.counts[s],0),owned=skills[job].reduce((t,s,i)=>t+(selected.has(i)?d.counts[s]:0),0),weighted=100*owned/total;app.innerHTML=`<span class="tag">MY CAREER REPORT</span><h1>${jobs[job]}</h1><p>선택한 탐색 직무 · 규칙 기반 추천 점수 ${sc}점</p><h2>기술 경험 현황 ${selected.size}/5 (${selected.size*20}%)</h2><div class="track"><div class="fill" style="width:${selected.size*20}%"></div></div><p class="note">대표 기술 중 선택한 비율이며 실제 직무 수행 능력이나 취업 가능성을 나타내지 않습니다.</p><h2>대표 5개 기술 가중 일치율 ${weighted.toFixed(1)}%</h2><div class="track"><div class="fill" style="width:${weighted}%"></div></div><h2>이미 경험한 기술</h2><p>${skills[job].filter((s,i)=>selected.has(i)).join(' · ')||'선택한 기술 없음'}</p><h2>새롭게 경험해 보면 좋은 기술</h2><p>아직 선택하지 않은 대표 기술을 채용공고 요구 비율이 높은 순으로 표시합니다. 요구 비율이 같으면 동일한 우선순위이며, 실제 숙련도를 평가하지 않습니다.</p>`+(missing.length?missing.map(s=>`<div class="skill"><b>${s}</b><br><small>${d&&s in d.counts?`채용공고 요구 비율 ${d.counts[s]/d.n*100}%`: '요구 빈도 미확인 · 대표 기술 목록 기반'}</small></div>`).join(''):'<p>대표 기술 5개 모두 선택했습니다. 활용 능력을 심화해 보세요.</p>')+`<h2>채용공고 분석 근거</h2>`+(d?`<p>11주차 데이터 분석 결과(RQ1, 1~3쪽)를 바탕으로 기술별 요구 비율을 표시합니다. 각 비율은 해당 직무의 분석 대상 채용공고 중 해당 기술이 기재된 비율입니다.</p>`+Object.entries(d.counts).sort((a,b)=>b[1]-a[1]).map(([s,c])=>`<div class="line"><span>${s}</span><b>${c/d.n*100}%</b></div>`).join(''):'<p class="note">이 직무의 실제 기술별 요구 빈도 원본은 아직 연결되지 않았습니다. 현재는 기존 대표 기술 목록만 제공합니다.</p>')+`<h2>전체 추천 점수</h2>`+r.map(x=>bar(x.name,x.score)).join('')+`<div class="nav"><button class="secondary" onclick="go(5)">다른 직무 탐색</button><button onclick="reset()">다시 테스트</button></div>`}
render();
</script></body></html>
